<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MANI DECORATION | Admin Panel</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>

  <style>
    *{box-sizing:border-box;margin:0;padding:0}

    body{
      font-family:Arial,Tahoma,sans-serif;
      background:#f4f4f4;
      color:#111;
    }

    header{
      background:#111;
      color:#fff;
      text-align:center;
      padding:18px;
      border-bottom:4px solid #d60000;
    }

    header h1{font-size:25px}
    header p{margin-top:5px;color:#ddd}

    .container{
      max-width:1100px;
      margin:auto;
      padding:15px;
    }

    .box{
      background:#fff;
      padding:18px;
      margin-bottom:15px;
      border-radius:12px;
      box-shadow:0 2px 8px rgba(0,0,0,.08);
    }

    h2{margin-bottom:15px}

    label{
      display:block;
      font-weight:bold;
      margin:12px 0 6px;
    }

    input,textarea,select{
      width:100%;
      padding:12px;
      border:1px solid #ccc;
      border-radius:8px;
      font-size:15px;
      background:#fff;
    }

    textarea{
      min-height:100px;
      resize:vertical;
    }

    button{
      border:0;
      border-radius:8px;
      padding:11px 15px;
      cursor:pointer;
      font-weight:bold;
    }

    .primary{
      background:#d60000;
      color:#fff;
      width:100%;
      margin-top:15px;
    }

    .dark{
      background:#111;
      color:#fff;
    }

    .danger{
      background:#a90000;
      color:#fff;
    }

    .success{
      background:#16803c;
      color:#fff;
    }

    .hidden{display:none!important}

    .message{
      margin-top:12px;
      padding:12px;
      background:#eee;
      border-radius:8px;
    }

    .stats{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:10px;
    }

    .stat{
      background:#111;
      color:#fff;
      padding:15px;
      border-radius:10px;
      text-align:center;
    }

    .stat strong{
      display:block;
      font-size:25px;
      margin-top:5px;
    }

    .product-row{
      display:grid;
      grid-template-columns:90px 1fr auto;
      gap:12px;
      align-items:center;
      padding:12px 0;
      border-bottom:1px solid #ddd;
    }

    .product-row img{
      width:90px;
      height:90px;
      object-fit:cover;
      border-radius:8px;
      background:#eee;
    }

    .actions{
      display:flex;
      gap:6px;
      flex-wrap:wrap;
    }

    .status{
      display:inline-block;
      margin-top:5px;
      padding:4px 8px;
      border-radius:5px;
      background:#eee;
      font-size:12px;
    }

    .preview{
      width:120px;
      height:120px;
      object-fit:cover;
      border-radius:10px;
      margin-top:10px;
      display:none;
    }

    @media(max-width:700px){
      .stats{grid-template-columns:repeat(2,1fr)}

      .product-row{
        grid-template-columns:70px 1fr;
      }

      .product-row img{
        width:70px;
        height:70px;
      }

      .actions{
        grid-column:1/-1;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>MANI DECORATION</h1>
  <p>Admin Panel</p>
</header>

<div class="container">

  <!-- LOGIN -->
  <section id="loginBox" class="box">

    <h2>Admin Login</h2>

    <label>Email</label>
    <input id="loginEmail" type="email" placeholder="Admin Email">

    <label>Password</label>
    <input id="loginPassword" type="password" placeholder="Password">

    <button class="primary" onclick="login()">
      Login
    </button>

    <div id="loginMessage" class="message"></div>

  </section>


  <!-- ADMIN AREA -->
  <div id="adminArea" class="hidden">

    <!-- DASHBOARD -->
    <section class="box">

      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
        <h2>Dashboard</h2>

        <button class="dark" onclick="logout()">
          Logout
        </button>
      </div>

      <div class="stats">

        <div class="stat">
          Products
          <strong id="productCount">0</strong>
        </div>

        <div class="stat">
          Product Views
          <strong id="viewCount">0</strong>
        </div>

        <div class="stat">
          Searches
          <strong id="searchCount">0</strong>
        </div>

        <div class="stat">
          WhatsApp
          <strong id="whatsappCount">0</strong>
        </div>

      </div>

    </section>


    <!-- ADD / EDIT PRODUCT -->
    <section class="box">

      <h2 id="formTitle">Add Product</h2>

      <input type="hidden" id="editingId">

      <label>Product Name</label>
      <input
        id="productName"
        type="text"
        placeholder="مثلاً Suzuki Seat Cover">

      <label>Category</label>
      <select id="productCategory">
        <option value="">Category منتخب کریں</option>
      </select>

      <label>Price (PKR)</label>
      <input
        id="productPrice"
        type="number"
        min="0"
        placeholder="مثلاً 3500">

      <label>Description</label>
      <textarea
        id="productDescription"
        placeholder="مختصر Description"></textarea>

      <label>Product Photo</label>
      <input
        id="productImage"
        type="file"
        accept="image/*">

      <img id="imagePreview" class="preview">

      <button class="primary" onclick="saveProduct()">
        Save Product
      </button>

      <button
        id="cancelEdit"
        class="dark hidden"
        style="width:100%;margin-top:8px"
        onclick="cancelEdit()">
        Cancel Edit
      </button>

      <div id="productMessage" class="message"></div>

    </section>


    <!-- PRODUCTS -->
    <section class="box">

      <h2>Products</h2>

      <input
        id="adminSearch"
        type="search"
        placeholder="Product search..."
        oninput="renderProducts()">

      <div id="productsList"></div>

    </section>

  </div>

</div>


<script>

  /* =========================================
     SUPABASE CONNECTION
     ========================================= */

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  let products = [];
  let categories = [];


  /* =========================================
     MESSAGE
     ========================================= */

  function showMessage(id, text){

    document.getElementById(id).textContent = text;

  }


  /* =========================================
     LOGIN
     ========================================= */

  async function login(){

    const email =
      document.getElementById("loginEmail").value.trim();

    const password =
      document.getElementById("loginPassword").value;

    if(!email || !password){

      showMessage(
        "loginMessage",
        "Email اور Password دونوں درج کریں۔"
      );

      return;
    }

    showMessage(
      "loginMessage",
      "Login ہو رہا ہے..."
    );

    const {error} =
      await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

    if(error){

      showMessage(
        "loginMessage",
        "Login Error: " + error.message
      );

      return;
    }

    document.getElementById("loginBox")
      .classList.add("hidden");

    document.getElementById("adminArea")
      .classList.remove("hidden");

    await initializeAdmin();

  }


  /* =========================================
     LOGOUT
     ========================================= */

  async function logout(){

    await supabaseClient.auth.signOut();

    document.getElementById("adminArea")
      .classList.add("hidden");

    document.getElementById("loginBox")
      .classList.remove("hidden");

  }


  /* =========================================
     CHECK SESSION
     ========================================= */

  async function checkSession(){

    const {data} =
      await supabaseClient.auth.getSession();

    if(data.session){

      document.getElementById("loginBox")
        .classList.add("hidden");

      document.getElementById("adminArea")
        .classList.remove("hidden");

      await initializeAdmin();

    }

  }


  /* =========================================
     LOAD CATEGORIES
     ========================================= */

  async function loadCategories(){

    const {data,error} =
      await supabaseClient
        .from("categories")
        .select("id,name,slug")
        .eq("is_active",true)
        .order("name");

    if(error){

      showMessage(
        "productMessage",
        "Categories load نہیں ہو سکیں: " + error.message
      );

      return;

    }

    categories = data || [];

    const select =
      document.getElementById("productCategory");

    select.innerHTML =
      '<option value="">Category منتخب کریں</option>';

    categories.forEach(category => {

      const option =
        document.createElement("option");

      option.value = category.id;
      option.textContent = category.name;

      select.appendChild(option);

    });

  }


  /* =========================================
     LOAD PRODUCTS
     ========================================= */

  async function loadProducts(){

    const {data,error} =
      await supabaseClient
        .from("products")
        .select(`
          id,
          product_code,
          name,
          category_id,
          price,
          description,
          image_url,
          is_visible,
          created_at,
          updated_at,
          categories (
            id,
            name
          )
        `)
        .order("created_at",{ascending:false});

    if(error){

      showMessage(
        "productMessage",
        "Products load نہیں ہو سکے: " + error.message
      );

      return;

    }

    products = data || [];

    renderProducts();

    document.getElementById("productCount")
      .textContent = products.length;

  }


  /* =========================================
     RENDER PRODUCTS
     ========================================= */

  function renderProducts(){

    const list =
      document.getElementById("productsList");

    const search =
      document.getElementById("adminSearch")
        .value
        .trim()
        .toLowerCase();

    const filtered =
      products.filter(product => {

        const categoryName =
          product.categories?.name || "";

        return (
          product.name.toLowerCase().includes(search) ||
          (product.product_code || "")
            .toLowerCase()
            .includes(search) ||
          categoryName
            .toLowerCase()
            .includes(search)
        );

      });


    if(filtered.length === 0){

      list.innerHTML =
        "<p style='padding:20px;text-align:center;color:#777'>ابھی کوئی Product نہیں ہے۔</p>";

      return;

    }


    list.innerHTML = "";


    filtered.forEach(product => {

      const row =
        document.createElement("div");

      row.className = "product-row";


      const image =
        product.image_url ||
        "https://placehold.co/300x300?text=MANI";


      const categoryName =
        product.categories?.name ||
        "No Category";


      row.innerHTML = `

        <img
          src="${image}"
          alt="${escapeHtml(product.name)}">

        <div>

          <strong>
            ${escapeHtml(product.name)}
          </strong>

          <div>
            Code:
            <b>${escapeHtml(product.product_code || "")}</b>
          </div>

          <div>
            Category:
            ${escapeHtml(categoryName)}
          </div>

          <div>
            Price:
            Rs. ${Number(product.price || 0).toLocaleString()}
          </div>

          <div class="status">
            ${product.is_visible ? "Visible" : "Hidden"}
          </div>

        </div>

        <div class="actions">

          <button
            class="dark"
            onclick="editProduct('${product.id}')">
            Edit
          </button>

          <button
            class="${product.is_visible ? "danger" : "success"}"
            onclick="toggleProduct('${product.id}',${product.is_visible})">
            ${product.is_visible ? "Hide" : "Show"}
          </button>

          <button
            class="danger"
            onclick="deleteProduct('${product.id}')">
            Delete
          </button>

        </div>

      `;

      list.appendChild(row);

    });

  }


  /* =========================================
     SAVE PRODUCT
     ========================================= */

  async function saveProduct(){

    const editingId =
      document.getElementById("editingId").value;

    const name =
      document.getElementById("productName")
        .value.trim();

    const categoryId =
      document.getElementById("productCategory")
        .value;

    const price =
      document.getElementById("productPrice")
        .value;

    const description =
      document.getElementById("productDescription")
        .value.trim();

    const imageInput =
      document.getElementById("productImage");


    if(!name || !categoryId || !price){

      showMessage(
        "productMessage",
        "Product Name، Category اور Price ضروری ہیں۔"
      );

      return;

    }


    showMessage(
      "productMessage",
      "Product save ہو رہا ہے..."
    );


    let imageUrl = null;


    /* IMAGE UPLOAD */

    if(imageInput.files.length > 0){

      const file =
        imageInput.files[0];

      const extension =
        file.name.split(".").pop();

      const fileName =
        Date.now() +
        "-" +
        Math.random()
          .toString(36)
          .substring(2) +
        "." +
        extension;

      const filePath =
        "products/" + fileName;


      const {error:uploadError} =
        await supabaseClient
          .storage
          .from("product-images")
          .upload(
            filePath,
            file,
            {
              cacheControl:"3600",
              upsert:false
            }
          );


      if(uploadError){

        showMessage(
          "productMessage",
          "Image upload error: " +
          uploadError.message
        );

        return;

      }


      const {data:urlData} =
        supabaseClient
          .storage
          .from("product-images")
          .getPublicUrl(filePath);

      imageUrl =
        urlData.publicUrl;

    }


    /* EDIT */

    if(editingId){

      const updateData = {
        name:name,
        category_id:Number(categoryId),
        price:Number(price),
        description:description
      };


      if(imageUrl){
        updateData.image_url = imageUrl;
      }


      const {error} =
        await supabaseClient
          .from("products")
          .update(updateData)
          .eq("id",editingId);


      if(error){

        showMessage(
          "productMessage",
          "Update Error: " + error.message
        );

        return;

      }


      showMessage(
        "productMessage",
        "Product successfully update ہو گیا۔"
      );

    }


    /* NEW PRODUCT */

    else{

      const insertData = {
        name:name,
        category_id:Number(categoryId),
        price:Number(price),
        description:description,
        is_visible:true
      };


      if(imageUrl){
        insertData.image_url = imageUrl;
      }


      const {error} =
        await supabaseClient
          .from("products")
          .insert(insertData);


      if(error){

        showMessage(
          "productMessage",
          "Save Error: " + error.message
        );

        return;

      }


      showMessage(
        "productMessage",
        "Product successfully add ہو گیا۔"
      );

    }


    cancelEdit();

    await loadProducts();

    await loadStats();

  }


  /* =========================================
     EDIT PRODUCT
     ========================================= */

  function editProduct(id){

    const product =
      products.find(
        item => String(item.id) === String(id)
      );

    if(!product) return;


    document.getElementById("editingId").value =
      product.id;

    document.getElementById("productName").value =
      product.name;

    document.getElementById("productCategory").value =
      product.category_id || "";

    document.getElementById("productPrice").value =
      product.price;

    document.getElementById("productDescription").value =
      product.description || "";


    document.getElementById("formTitle")
      .textContent = "Edit Product";

    document.getElementById("cancelEdit")
      .classList.remove("hidden");


    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

  }


  /* =========================================
     CANCEL EDIT
     ========================================= */

  function cancelEdit(){

    document.getElementById("editingId").value = "";

    document.getElementById("productName").value = "";

    document.getElementById("productCategory").value = "";

    document.getElementById("productPrice").value = "";

    document.getElementById("productDescription").value = "";

    document.getElementById("productImage").value = "";

    document.getElementById("imagePreview").style.display = "none";

    document.getElementById("formTitle")
      .textContent = "Add Product";

    document.getElementById("cancelEdit")
      .classList.add("hidden");

  }


  /* =========================================
     SHOW / HIDE
     ========================================= */

  async function toggleProduct(id,currentStatus){

    const newStatus =
      !currentStatus;


    const {error} =
      await supabaseClient
        .from("products")
        .update({
          is_visible:newStatus
        })
        .eq("id",id);


    if(error){

      showMessage(
        "productMessage",
        "Status Error: " + error.message
      );

      return;

    }


    await loadProducts();

  }


  /* =========================================
     DELETE PRODUCT
     ========================================= */

  async function deleteProduct(id){

    const product =
      products.find(
        item => String(item.id) === String(id)
      );

    if(!product) return;


    const confirmed =
      confirm(
        "کیا آپ واقعی " +
        product.name +
        " کو delete کرنا چاہتے ہیں؟"
      );


    if(!confirmed) return;


    const {error} =
      await supabaseClient
        .from("products")
        .delete()
        .eq("id",id);


    if(error){

      showMessage(
        "productMessage",
        "Delete Error: " + error.message
      );

      return;

    }


    showMessage(
      "productMessage",
      "Product delete ہو گیا۔"
    );


    await loadProducts();

    await loadStats();

  }


  /* =========================================
     ANALYTICS
     ========================================= */

  async function loadStats(){

    const results =
      await Promise.all([

        supabaseClient
          .from("product_views")
          .select("*",{count:"exact",head:true}),

        supabaseClient
          .from("search_events")
          .select("*",{count:"exact",head:true}),

        supabaseClient
          .from("whatsapp_clicks")
          .select("*",{count:"exact",head:true})

      ]);


    document.getElementById("viewCount")
      .textContent =
      results[0].count || 0;

    document.getElementById("searchCount")
      .textContent =
      results[1].count || 0;

    document.getElementById("whatsappCount")
      .textContent =
      results[2].count || 0;

  }


  /* =========================================
     IMAGE PREVIEW
     ========================================= */

  document
    .getElementById("productImage")
    .addEventListener("change",function(){

      const file = this.files[0];

      const preview =
        document.getElementById("imagePreview");

      if(!file)
        {
  preview.style.display = "none";
  return;
}

preview.src = URL.createObjectURL(file);
preview.style.display = "block";

});


/* =========================================
   HTML ESCAPE
   ========================================= */

function escapeHtml(value){

  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================
   INITIALIZE
   ========================================= */

async function initializeAdmin(){

  await loadCategories();

  await loadProducts();

  await loadStats();

}


/* =========================================
   START
   ========================================= */

checkSession();

</script>

</body>
</html>
