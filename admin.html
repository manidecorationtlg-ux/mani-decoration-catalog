<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MANI DECORATION | Admin Panel</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Tahoma, sans-serif;
      background: #f3f3f3;
      color: #111;
    }

    header {
      background: #111;
      color: #fff;
      padding: 18px;
      text-align: center;
      border-bottom: 4px solid #d60000;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 15px;
    }

    .box {
      background: #fff;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    h2 {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin: 12px 0 6px;
      font-weight: bold;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 11px 16px;
      cursor: pointer;
      font-weight: bold;
    }

    .primary {
      background: #d60000;
      color: white;
      width: 100%;
      margin-top: 15px;
    }

    .dark {
      background: #111;
      color: white;
    }

    .danger {
      background: #b00000;
      color: white;
    }

    .hidden {
      display: none !important;
    }

    .message {
      padding: 12px;
      border-radius: 8px;
      margin-top: 12px;
      background: #eee;
    }

    .product-row {
      display: grid;
      grid-template-columns: 90px 1fr auto;
      gap: 12px;
      align-items: center;
      border-bottom: 1px solid #ddd;
      padding: 12px 0;
    }

    .product-row img {
      width: 90px;
      height: 90px;
      object-fit: cover;
      border-radius: 8px;
      background: #eee;
    }

    .actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .stat {
      background: #111;
      color: white;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
    }

    .stat strong {
      display: block;
      font-size: 24px;
      margin-top: 5px;
    }

    @media (min-width: 700px) {
      .stats {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    @media (max-width: 600px) {
      .product-row {
        grid-template-columns: 70px 1fr;
      }

      .product-row img {
        width: 70px;
        height: 70px;
      }

      .actions {
        grid-column: 1 / -1;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>MANI DECORATION</h1>
  <p>Admin Panel</p>
</header>

<div class="container">

  <!-- LOGIN -->
  <section id="loginBox" class="box">

    <h2>Admin Login</h2>

    <label>Email</label>
    <input id="loginEmail" type="email" placeholder="Admin Email">

    <label>Password</label>
    <input id="loginPassword" type="password" placeholder="Password">

    <button class="primary" onclick="login()">
      Login
    </button>

    <div id="loginMessage" class="message"></div>

  </section>


  <!-- ADMIN -->
  <div id="adminArea" class="hidden">

    <section class="box">

      <div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;">
        <h2>Dashboard</h2>

        <button class="dark" onclick="logout()">
          Logout
        </button>
      </div>

      <div class="stats">

        <div class="stat">
          Products
          <strong id="productCount">0</strong>
        </div>

        <div class="stat">
          Product Views
          <strong id="viewCount">0</strong>
        </div>

        <div class="stat">
          Searches
          <strong id="searchCount">0</strong>
        </div>

        <div class="stat">
          WhatsApp Clicks
          <strong id="whatsappCount">0</strong>
        </div>

      </div>

    </section>


    <!-- ADD PRODUCT -->
    <section class="box">

      <h2 id="formTitle">Add Product</h2>

      <input type="hidden" id="editingId">

      <label>Product Name</label>
      <input id="productName" type="text"
             placeholder="مثلاً Suzuki Seat Cover">

      <label>Category</label>
      <select id="productCategory"></select>

      <label>Price (PKR)</label>
      <input id="productPrice" type="number"
             placeholder="مثلاً 3500">

      <label>Description</label>
      <textarea id="productDescription"
                placeholder="مختصر Description"></textarea>

      <label>Product Photo</label>
      <input id="productImage"
             type="file"
             accept="image/*">

      <button class="primary" onclick="saveProduct()">
        Save Product
      </button>

      <button
        id="cancelEdit"
        class="dark hidden"
        style="width:100%;margin-top:8px;"
        onclick="cancelEdit()">
        Cancel Edit
      </button>

      <div id="productMessage" class="message"></div>

    </section>


    <!-- PRODUCTS -->
    <section class="box">

      <h2>Products</h2>

      <input
        id="adminSearch"
        type="search"
        placeholder="Product search..."
        oninput="renderProducts()">

      <div id="productsList"></div>

    </section>

  </div>

</div>


<script>

  /*
    ======================================
    MANI DECORATION ADMIN PANEL
    ======================================

    Supabase connection اگلے مرحلے میں
    safely configure کی جائے گی.
  */

  const SUPABASE_URL =
    "https://mratyuowwaibihukguic.supabase.co";

  /*
    IMPORTANT:
    Publishable key یہاں بعد میں لگائی جائے گی.
    Secret key کبھی یہاں نہ لگائیں.
  */

  const SUPABASE_PUBLISHABLE_KEY = "";


  const CATEGORY_LIST = [
    "Number Plates",
    "Seat Covers",
    "Dashboard Covers",
    "Stickers",
    "Lights",
    "Floor Mats",
    "Car Decoration",
    "Shazore / Porter",
    "Hyundai",
    "Suzuki",
    "JAC X200",
    "Other Parts"
  ];


  let products = [];


  function loadCategories() {

    const select =
      document.getElementById("productCategory");

    select.innerHTML =
      '<option value="">Category Select کریں</option>';

    CATEGORY_LIST.forEach(category => {

      const option =
        document.createElement("option");

      option.value = category;
      option.textContent = category;

      select.appendChild(option);

    });

  }


  function login() {

    const email =
      document.getElementById("loginEmail").value.trim();

    const password =
      document.getElementById("loginPassword").value;

    const message =
      document.getElementById("loginMessage");


    if (!email || !password) {

      message.textContent =
        "Email اور Password دونوں درج کریں۔";

      return;
    }


    /*
      Supabase Authentication اگلے مرحلے میں
      connect ہوگی۔
    */

    message.textContent =
      "Supabase connection ابھی configure ہونا باقی ہے۔";

  }


  function logout() {

    document.getElementById("adminArea")
      .classList.add("hidden");

    document.getElementById("loginBox")
      .classList.remove("hidden");

  }


  function renderProducts() {

    const list =
      document.getElementById("productsList");

    const search =
      document.getElementById("adminSearch")
        .value
        .toLowerCase()
        .trim();


    const filtered =
      products.filter(product =>
        product.name.toLowerCase().includes(search)
      );


    if (filtered.length === 0) {

      list.innerHTML =
        "<p style='padding:20px;text-align:center;color:#777;'>ابھی کوئی Product نہیں۔</p>";

      return;
    }


    list.innerHTML = "";


    filtered.forEach(product => {

      const row =
        document.createElement("div");

      row.className = "product-row";


      row.innerHTML = `

        <img src="${product.image || ''}"
             alt="${product.name}">

        <div>

          <strong>${product.name}</strong>

          <div>
            Code: ${product.code}
          </div>

          <div>
            Category: ${product.category}
          </div>

          <div>
            Price: Rs. ${product.price}
          </div>

          <div>
            Status: ${product.visible ? "Visible" : "Hidden"}
          </div>

        </div>

        <div class="actions">

          <button class="dark"
                  onclick="editProduct('${product.id}')">
            Edit
          </button>

          <button
            class="${product.visible ? "danger" : "dark"}"
            onclick="toggleProduct('${product.id}')">
            ${product.visible ? "Hide" : "Show"}
          </button>

          <button class="danger"
                  onclick="deleteProduct('${product.id}')">
            Delete
          </button>

        </div>

      `;

      list.appendChild(row);

    });

  }


  function editProduct(id) {

    const product =
      products.find(item => item.id == id);

    if (!product) return;

    document.getElementById("editingId").value =
      product.id;

    document.getElementById("productName").value =
      product.name;

    document.getElementById("productCategory").value =
      product.category;

    document.getElementById("productPrice").value =
      product.price;

    document.getElementById("productDescription").value =
      product.description || "";

    document.getElementById("formTitle").textContent =
      "Edit Product";

    document.getElementById("cancelEdit")
      .classList.remove("hidden");

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }


  function cancelEdit() {

    document.getElementById("editingId").value = "";

    document.getElementById("productName").value = "";

    document.getElementById("productCategory").value = "";

    document.getElementById("productPrice").value = "";

    document.getElementById("productDescription").value = "";

    document.getElementById("productImage").value = "";

    document.getElementById("formTitle").textContent =
      "Add Product";

    document.getElementById("cancelEdit")
      .classList.add("hidden");

  }


  function saveProduct() {

    const name =
      document.getElementById("productName")
        .value.trim();

    const category =
      document.getElementById("productCategory")
        .value;

    const price =
      document.getElementById("productPrice")
        .value;

    const description =
      document.getElementById("productDescription")
        .value.trim();

    const message =
      document.getElementById("productMessage");


    if (!name || !category || !price) {

      message.textContent =
        "Product Name، Category اور Price ضروری ہیں۔";

      return;
    }


    message.textContent =
      "Supabase connection کے بعد Product save ہوگا.";

  }


  function toggleProduct(id) {

    const product =
      products.find(item => item.id == id);

    if (!product) return;

    product.visible =
      !product.visible;

    renderProducts();

  }


  function deleteProduct(id) {

    if (!confirm("کیا آپ واقعی یہ Product delete کرنا چاہتے ہیں؟")) {
      return;
    }

    products =
      products.filter(item => item.id != id);

    renderProducts();

  }


  loadCategories();
  renderProducts();

</script>

</body>
</html>
