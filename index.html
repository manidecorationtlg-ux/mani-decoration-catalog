<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MANI DECORATION | Online Catalog</title>

  <meta name="description"
        content="MANI DECORATION Online Product Catalog - Car Decoration, Seat Covers, Number Plates, Stickers, Lights and Auto Accessories.">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Tahoma, sans-serif;
      background: #f5f5f5;
      color: #171717;
    }

    header {
      background: #111;
      color: white;
      padding: 18px 15px;
      text-align: center;
      border-bottom: 4px solid #d60000;
    }

    header h1 {
      font-size: 25px;
      margin-bottom: 5px;
    }

    header p {
      color: #ddd;
      font-size: 14px;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      margin: auto;
      padding: 15px;
    }

    .search-box {
      margin: 10px 0 15px;
    }

    .search-box input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
      background: white;
    }

    .categories {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 10px;
    }

    .category-btn {
      flex: 0 0 auto;
      border: none;
      background: #222;
      color: white;
      padding: 10px 15px;
      border-radius: 20px;
      cursor: pointer;
      white-space: nowrap;
    }

    .category-btn.active,
    .category-btn:hover {
      background: #d60000;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .product {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .product-image {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      background: #eee;
      display: block;
    }

    .product-info {
      padding: 11px;
    }

    .product-code {
      color: #777;
      font-size: 12px;
      margin-bottom: 5px;
    }

    .product-name {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 7px;
      line-height: 1.4;
    }

    .product-price {
      color: #d60000;
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 9px;
      direction: ltr;
      text-align: right;
    }

    .whatsapp-btn {
      display: block;
      width: 100%;
      text-align: center;
      background: #111;
      color: white;
      text-decoration: none;
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
    }

    .whatsapp-btn:hover {
      background: #d60000;
    }

    .empty {
      text-align: center;
      padding: 40px 15px;
      color: #777;
      grid-column: 1 / -1;
    }

    footer {
      margin-top: 30px;
      background: #111;
      color: white;
      text-align: center;
      padding: 20px 10px;
      font-size: 13px;
    }

    @media (min-width: 700px) {
      .products {
        grid-template-columns: repeat(4, 1fr);
      }
    }
  </style>
</head>

<body>

<header>
  <h1>MANI DECORATION</h1>
  <p>Online Product Catalog</p>
</header>

<main class="container">

  <div class="search-box">
    <input
      type="search"
      id="searchInput"
      placeholder="پروڈکٹ تلاش کریں..."
      autocomplete="off">
  </div>

  <div class="categories" id="categories"></div>

  <section class="products" id="products"></section>

</main>

<footer>
  <p>MANI DECORATION</p>
  <p>Auto Decoration & Accessories</p>
</footer>

<script>

  /*
    ==========================================
    MANI DECORATION CATALOG
    Temporary Front-End Test Data
    ==========================================

    بعد میں یہی جگہ Supabase Database سے
    automatically products حاصل کرے گی۔
  */

  const WHATSAPP_NUMBER = "923000000000";

  const categories = [
    "All",
    "Number Plates",
    "Seat Covers",
    "Dashboard Covers",
    "Stickers",
    "Lights",
    "Floor Mats",
    "Car Decoration",
    "Shazore / Porter",
    "Hyundai",
    "Suzuki",
    "JAC X200",
    "Other Parts"
  ];

  const products = [];

  let selectedCategory = "All";

  const categoriesBox = document.getElementById("categories");
  const productsBox = document.getElementById("products");
  const searchInput = document.getElementById("searchInput");

  function renderCategories() {

    categoriesBox.innerHTML = "";

    categories.forEach(category => {

      const button = document.createElement("button");

      button.className =
        "category-btn " +
        (category === selectedCategory ? "active" : "");

      button.textContent = category;

      button.addEventListener("click", () => {

        selectedCategory = category;

        renderCategories();
        renderProducts();

      });

      categoriesBox.appendChild(button);

    });

  }

  function renderProducts() {

    const searchText =
      searchInput.value.trim().toLowerCase();

    const filteredProducts = products.filter(product => {

      const categoryMatch =
        selectedCategory === "All" ||
        product.category === selectedCategory;

      const searchMatch =
        product.name.toLowerCase().includes(searchText) ||
        product.code.toLowerCase().includes(searchText) ||
        product.category.toLowerCase().includes(searchText);

      return categoryMatch && searchMatch;

    });

    productsBox.innerHTML = "";

    if (filteredProducts.length === 0) {

      productsBox.innerHTML = `
        <div class="empty">
          <h3>ابھی کوئی پروڈکٹ موجود نہیں</h3>
          <p>پروڈکٹس جلد یہاں دکھائی جائیں گی۔</p>
        </div>
      `;

      return;
    }

    filteredProducts.forEach(product => {

      const card = document.createElement("article");

      card.className = "product";

      const whatsappMessage =
        encodeURIComponent(
          `السلام علیکم، مجھے ${product.name} (${product.code}) کے بارے میں معلومات چاہیے۔`
        );

      card.innerHTML = `

        <img
          class="product-image"
          src="${product.image}"
          alt="${product.name}">

        <div class="product-info">

          <div class="product-code">
            Code: ${product.code}
          </div>

          <div class="product-name">
            ${product.name}
          </div>

          <div class="product-price">
            Rs. ${product.price}
          </div>

          <a
            class="whatsapp-btn"
            href="https://wa.me/${WHATSAPP_NUMBER}?text=${whatsappMessage}"
            target="_blank"
            rel="noopener">
            WhatsApp پر رابطہ کریں
          </a>

        </div>
      `;

      productsBox.appendChild(card);

    });

  }

  searchInput.addEventListener("input", renderProducts);

  renderCategories();
  renderProducts();

</script>

</body>
</html>
